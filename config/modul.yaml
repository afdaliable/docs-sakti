# Daftar modul SAKTI = sumber kebenaran untuk sidebar, halaman modul, kartu landing page,
# taksonomi frontmatter (field `modul`), dan CODEOWNERS.
#
# Acuan: pohon menu asli aplikasi SAKTI di sources/menu.json (keputusan K1, K25-K27 di
# docs/09-keputusan-terbuka.md). Nama dan urutan modul serta sub-menu HARUS sama dengan
# menu.json; `pnpm test` gagal jika berbeda (tests/menu.test.ts).
#
# Field:
#   slug        : folder di src/content/docs/<slug>/ dan segmen URL
#   kode        : `kode` simpul di sources/menu.json. Tanpa `kode` = bagian khusus KB
#                 yang tidak ada di menu SAKTI.
#   nama        : label persis seperti di menu SAKTI (menu.json)
#   kelompok    : pengelompokan di landing page (bukan bagian menu SAKTI)
#   ikon        : nama ikon Starlight (https://starlight.astro.build/reference/icons/)
#   ringkasan   : 1 kalimat untuk kartu
#   sumber      : sumber utama (A/B/C, lihat docs/01-sumber-konten.md); [] = belum ada sumber
#   sub         : sub-menu tingkat 1 (urutan sidebar): semua anak simpul modul di menu.json,
#                 lalu sub khusus KB (tanpa `kode`). Halaman indeks sub-menu hanya dibuat
#                 bila ada artikel di bawahnya. Tingkat berikutnya dibentuk dari folder.


