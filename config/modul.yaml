# Daftar modul SAKTI = sumber kebenaran untuk sidebar, halaman modul, kartu landing page,
# taksonomi frontmatter (field `modul`), dan CODEOWNERS.
#
# ⚠️ KONFIRMASI KE PEMILIK PROYEK: urutan dan nama harus sama persis dengan menu SAKTI
# yang berlaku. Lihat docs/09-keputusan-terbuka.md (K1).
#
# Field:
#   slug        : folder di src/content/docs/<slug>/ dan segmen URL
#   nama        : label sesuai menu SAKTI
#   kelompok    : pengelompokan di landing page
#   ikon        : nama ikon Starlight (https://starlight.astro.build/reference/icons/)
#   ringkasan   : 1 kalimat untuk kartu
#   sumber      : sumber utama (A/B/C, lihat docs/01-sumber-konten.md)
#   sub         : sub-menu tingkat 1 (urutan sidebar). Tingkat berikutnya dibentuk dari folder.
#                 Entri berupa slug, atau { slug, nama } jika nama menu SAKTI berbeda
#                 dari label yang dibentuk otomatis dari slug.


kelompok:
  - id: umum
    nama: Mulai & Administrasi
  - id: pelaksanaan
    nama: Pelaksanaan Anggaran
  - id: pelaporan
    nama: Akuntansi & Pelaporan
  - id: bun
    nama: BUN (KPPN & Kanwil)

modul:
  - slug: mulai
    nama: Mulai Menggunakan SAKTI
    kelompok: umum
    ikon: rocket
    ringkasan: Akses aplikasi, pendaftaran user, MFA, dan email SAKTI.
    sumber: [A]
    sub: [akses-aplikasi, pendaftaran-user, { slug: mfa, nama: MFA }, { slug: email-sakti, nama: Email SAKTI }]

  - slug: admin
    nama: Administrasi (Admin)
    kelompok: umum
    ikon: setting
    ringkasan: Pengelolaan user, role, PKIPA, dan monitoring status DS.
    sumber: [A]
    sub: [role, manajemen-user, { slug: pkipa, nama: PKIPA }, { slug: monitoring-ds, nama: Monitoring Status DS }, formulir]

  - slug: referensi
    nama: Referensi
    kelompok: umum
    ikon: open-book
    ringkasan: Data referensi satker, akun, dan tabel pendukung.
    sumber: []        # belum ada sumber; buat halaman indeks saja
    sub: []

  - slug: penganggaran
    nama: Penganggaran
    kelompok: pelaksanaan
    ikon: document
    ringkasan: Penyusunan, revisi, dan pengelolaan DIPA.
    sumber: []        # belum ada sumber; tanyakan (K1)
    sub: []

  - slug: komitmen
    nama: Komitmen
    kelompok: pelaksanaan
    ikon: pencil
    ringkasan: Supplier, kontrak, BAST, escrow, dan ADK GPP.
    sumber: [B, C]
    sub: [{ slug: ruh, nama: RUH }, { slug: escrow, nama: Proses Escrow }, cetak, { slug: adk, nama: ADK }, { slug: upload, nama: Upload/Rekam }, monitoring, jurnal]

  - slug: pembayaran
    nama: Pembayaran
    kelompok: pelaksanaan
    ikon: approve-check
    ringkasan: SPP, SPM, catat/upload, dan monitoring pembayaran.
    sumber: [B, C]
    sub: [{ slug: ruh, nama: RUH Pembayaran }, cetak, { slug: adk, nama: ADK }, { slug: catat-upload, nama: Catat/Upload }, monitoring, referensi]

  - slug: bendahara
    nama: Bendahara
    kelompok: pelaksanaan
    ikon: list-format
    ringkasan: BKU, pajak, LPJ, dan transaksi bendahara.
    sumber: [B, C]
    sub: []

  - slug: persediaan
    nama: Persediaan
    kelompok: pelaporan
    ikon: puzzle
    ringkasan: Transaksi masuk/keluar, koreksi, opname, dan tutup buku persediaan.
    sumber: [C]
    sub: [transaksi-masuk, transaksi-keluar, koreksi, opname-fisik, tutup-buku, referensi, persediaan-dalam-proses, pelaporan, migrasi-data, monitoring, persediaan-tak-dikuasai, likuidasi, { slug: upload-data-blu, nama: Upload Data BLU }]

  - slug: aset-tetap
    nama: Aset Tetap
    kelompok: pelaporan
    ikon: laptop
    ringkasan: Transaksi BMN, KDP, persetujuan, normalisasi, dan konsesi jasa.
    sumber: [C]
    sub: [{ slug: ruh, nama: RUH }, persetujuan, monitoring, cetak, penutupan-periode, { slug: adk, nama: ADK }, likuidasi, normalisasi, konsesi-jasa-mitra, { slug: penghapusan-masal, nama: Usul Hapus & Penghapusan Masal }, referensi]

  - slug: piutang
    nama: Piutang
    kelompok: pelaporan
    ikon: information
    ringkasan: Debitur, pencatatan, settlement, penyisihan, dan pelimpahan piutang.
    sumber: [C]
    sub: [referensi, pencatatan, transaksi, koreksi, transfer, laporan, tutup-periode, upload, piutang-jangka-panjang, likuidasi]

  - slug: akuntansi-pelaporan
    nama: Akuntansi dan Pelaporan (GLP)
    kelompok: pelaporan
    ikon: seti:config
    ringkasan: Jurnal, posting, tutup buku, resiprokal, dan laporan keuangan.
    sumber: [C]
    sub: [proses, tutup-buku, transaksi-resiprokal, laporan, { slug: mphl-bjs, nama: Juknis MPHL-BJS SAKTI }, likuidasi-satker, { slug: koreksi-spm-jurnal-manual, nama: Koreksi SPM yang Memerlukan Jurnal Manual }]

  - slug: kppn-bun
    nama: KPPN (BUN)
    kelompok: bun
    ikon: star
    ringkasan: Fungsi Kuasa BUN di SAKTI untuk KPPN dan Kanwil DJPb.
    sumber: [A, B]
    sub: []

